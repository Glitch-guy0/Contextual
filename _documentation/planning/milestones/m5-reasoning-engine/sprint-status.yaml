      - "Failover switches transparently without throwing 5xx to client"
      - "Response carries header or stream metadata x-fallback-provider: groq"
      - "AbortSignal from incoming request aborts active provider stream cleanly (FM-504)"
      - "If both providers fail, surfaces HTTP 502 UPSTREAM_PROVIDER_UNAVAILABLE with automatic credit refund compensation"
    tests:
