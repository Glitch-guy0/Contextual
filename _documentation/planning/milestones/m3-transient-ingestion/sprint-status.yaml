# Sprint Status — M3: Transient Ingestion Pipeline & Multi-Source Extraction
# Sprint Owner: sprint-agent
# Planned Version: v0.3.0
sprint:
  id: M3-S1
  milestone: M3
  status: completed
  phased_deployment_profile:
    mode: expand
    risk_tier: high
    target_version: "0.3.0"
    release_model: feature-expand
    expand_tier: "1-b"
    expand_geometry_note: >
      M3 is expand-phase, non-breaking release per ADR-0004 posture.
      No version bump mechanics in current workspace yet; release tag and
      bump cadence are owned downstream by versioning-specialist once code exists.
  target_end: 2026-11-06
  start_on: "manual"
  stories:
