    risk_tier: medium
    target_version: "0.6.0"
    release_model: feature-expand
    expand_tier: "1-a"
    expand_geometry_note: >-
      M6 is an expand-phase, backward-compatible release: introduces @repo/memory
      package, MemoryStore contract, and /users/me/memories endpoints. No database
      relational schema migration is required. Existing error catalogue remains intact.
  target_end: 2026-12-15
  start_on: "manual"
  stories:
    - S6.1
    - S6.2
    - S6.3
    - S6.4
    - S6.5
    - S6.6

