# Sprint Status — GA: General Availability Production Release (v1.0.0)
# Sprint Owner: sprint-agent
# Planned Version: v1.0.0
sprint:
  id: GA-S1
  milestone: GA
  status: complete
  phased_deployment_profile:
    mode: expand
    risk_tier: high
    target_version: "1.0.0"
    release_model: production-release
    expand_tier: "1-a"
    expand_geometry_note: >-
      Milestone GA delivers the final General Availability production release (v1.0.0) of the Contextual AI Platform.
      It introduces GitHub Actions CI/CD pipeline automation (.github/workflows/ci.yml), Vercel Hobby production
      serverless deployment configuration (vercel.json), automated post-deployment production smoke verification suite
      (tests/e2e/production-smoke.test.ts, scripts/production-smoke.ts), comprehensive release CHANGELOG.md documenting
      M0 through GA, annotated Git release tagging automation (scripts/cut-release-tag.ts), and Checkpoint 5 closeout.
      All existing 11 internal packages and closed 17-member RFC 9457 error catalogue remain strictly unmodified.
  target_end: 2026-12-31
  start_on: "manual"
  stories:
    - SGA.1
    - SGA.2
    - SGA.3
    - SGA.4
    - SGA.5
    - SGA.6

stories:
  - id: SGA.1
    title: GitHub Actions CI/CD Pipeline workflow and automated pre-merge verification suite
    status: complete
    phase: Complete
    priority: p0
    owner: developer-agent
    effort: 3
    work_unit: WU-GA-1
    risk_tier: LOW
    build_vs_buy_ref: "BUILD — custom GitHub Actions workflow in .github/workflows/ci.yml utilizing official oven-sh/setup-bun@v2 action with zero third-party SaaS CI dependencies."
    acceptance:
      - "Create .github/workflows/ci.yml triggering on pushes to main and pull requests targeting main"
      - "Configure runner on ubuntu-latest with oven-sh/setup-bun@v2 and bun install --frozen-lockfile"
      - "Execute automated pre-merge stages: bun run lint, bun run typecheck, bun test, and bun run build"
      - "Assert closed 17-member RFC 9457 error catalogue test runs and passes as an explicit pipeline gate"
      - "Author unit test tests/ci/ci-workflow.test.ts validating YAML syntax, trigger events, step commands, and error catalogue assertions"
      - "Verify workflow executes in < 3 minutes without requiring external cloud secrets for standard PRs"
    tests:
      - "tests/ci/ci-workflow.test.ts — syntax validation, step order assertions, and error catalogue verification"
      - "bun test packages/contracts/tests/errors.test.ts — catalogue test passes 5/5"
    observability:
      - "GitHub Actions step logs with timestamps, exit codes, and stdout/stderr capture"
    verified: true
    depends_on: []
    change_matrix:
      new_files:
        - ".github/workflows/ci.yml"
        - "tests/ci/ci-workflow.test.ts"
      allowed_files:
        - ".github/workflows/**"
        - "tests/ci/**"
      forbidden_files:
