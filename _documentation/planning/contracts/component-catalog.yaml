rules:
  - "Domain packages must never import Next.js web transport libraries (next/server)"
  - "Graph reads and writes must carry a user_id tenant predicate inside the repository; route handlers never issue their own SQL"
  - "@repo/metering debit may only be invoked after the workspace ownership predicate has returned a row"
  - "Direct database connections must never be instantiated outside @repo/db"
  - "All external vector calls must route through @repo/contracts/VectorStore interface"
  - "All upstream error handling must map directly to RFC 9457 Problem Details"
  - "100% of protected API endpoints (/api/v1/*) must sit behind comp-middleware guard"
  - "All cron endpoints must verify cryptographic Upstash-Signature headers before execution"
  - "Zero un-redacted credentials, tokens, or connection strings may be emitted to logs or traces"
  - "Public marketing routes and components must never require or consume authenticated session state or cookies (BR-024)"
  - "The AI provider training disclosure banner must be rendered permanently without dismissal controls (BR-030, FR-030)"
  - "All public components must comply with WCAG 2.1 AA accessibility standards (NFR-019)"



