      public_types:
        - "SubQuestion"
        - "HydePassage"
        - "RetrievedContextChunk"
        - "CitationAnchor"
        - "StreamReasoningChunk"
        - "ChatSynthesisRequest"
        - "ChatSynthesisResult"
        - "InferenceProviderType"
      methods:
        - "synthesizeStream(ctx: TenantContext, req: ChatSynthesisRequest): AsyncIterable<StreamReasoningChunk>"
        - "decomposeQuery(prompt: string): Promise<SubQuestion[]>"
        - "generateHyde(subQuestions: SubQuestion[]): Promise<HydePassage[]>"
        - "retrieveContext(ctx: TenantContext, notebookId: string, subQuestions: SubQuestion[]): Promise<RetrievedContextChunk[]>"
    dependencies:
      - target: "@google/genai"
        severity: "FATAL"
        type: "external_service"
      - target: "groq-sdk"
        severity: "WARN"
        type: "external_service"
      - target: "@upstash/vector"
        severity: "FATAL"
        type: "external_service"
      - target: "@repo/contracts"
