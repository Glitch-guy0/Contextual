# Component Catalog — Architecture Contract
# Canonical software inventory, service boundaries, and dependency rules.
# Owned by architect-agent.
version: 1
updated_at: "2026-10-26T14:50:00.000Z"

components:
  - id: "comp-auth"
    name: "Authentication & Identity Module"
    package: "@repo/auth"
    owner: "architect-agent"
    responsibilities:
      - "Verify Clerk OAuth RS256 JWT tokens"
      - "Inject verified TenantContext into request context"
      - "Reject unauthenticated requests with HTTP 401 Problem Details"
    interfaces:
      public_types:
        - "TenantContext"
        - "AuthSession"
      methods:
        - "verifyToken(rawJwt: string): Promise<TenantContext>"
    dependencies:
      - target: "@clerk/backend"
        severity: "FATAL"
        type: "external_sdk"
      - target: "@repo/contracts"
        severity: "FATAL"
        type: "internal_package"

  - id: "comp-metering"
    name: "Metering Spine & Rate Limiter"
    package: "@repo/metering"
    owner: "architect-agent"
    responsibilities:
      - "Enforce 5 RPS sliding window rate limiting via Redis sorted sets"
      - "Execute atomic credit debit (0.5 LLM, 1.0 Ingest) via single Lua script"
      - "Short-circuit exhausted accounts with HTTP 402 Insufficient Credits"
      - "Execute idempotent daily 08:00 UTC credit resets"
      - "Classify upstream AI provider errors into RFC 9457 service limit details"
      - "Inject standardized RateLimit and X-Credit headers into HTTP responses"
    interfaces:
      public_types:
        - "RateLimitResult"
        - "DebitResult"
        - "ResetResult"
        - "QuotaClassification"
        - "RateLimitHeaders"
      methods:
        - "checkRateLimit(userId: string): Promise<RateLimitResult>"
        - "debitCredits(userId: string, cost: number, action: string): Promise<DebitResult>"
        - "resetDailyCredits(userId: string): Promise<ResetResult>"
        - "classifyQuotaError(upstreamError: unknown): QuotaClassification"
        - "generateRateLimitHeaders(limit: number, remaining: number, resetSeconds: number): Headers"
    dependencies:
      - target: "@upstash/redis"
        severity: "FATAL"
        type: "external_service"
      - target: "@repo/contracts"
        severity: "FATAL"
        type: "internal_package"

  - id: "comp-contracts"
    name: "Contracts & RFC 9457 Error System"
    package: "@repo/contracts"
    owner: "architect-agent"
    responsibilities:
      - "Enforce closed 17-member RFC 9457 Problem Details error catalogue"
      - "Format and sanitize HTTP API error envelopes"
      - "Export shared Zod DTOs, OpenAPI types, and quota extension interfaces"
    interfaces:
      public_types:
        - "ProblemDocument"
        - "ErrorCatalogueKey"
        - "QuotaExtension"
        - "ValidationErrorItem"
      methods:
        - "createProblemDetails(key: ErrorCatalogueKey, params: CreateProblemParams): ProblemDocument"
    dependencies:
      - target: "zod"
        severity: "FATAL"
        type: "external_package"

  - id: "comp-ingestion"
    name: "Transient Ingestion & Extraction Worker"
    package: "@repo/ingestion"
    owner: "architect-agent"
    status: implemented-scaffold
    responsibilities:
      - "Issue pre-signed Filebase S3 upload URLs (<= 5MB ceiling)"
      - "Parse PDF documents, YouTube transcripts, and web URLs"
      - "Recursively split text into 800-char semantic chunks with 100-char overlap"
      - "Generate dense vector embeddings via Google gemini-embedding-001 (768-dim)"
      - "Execute in-process fallback embeddings via @huggingface/transformers ONNX on Google 429"
      - "Upsert vectors to Upstash Vector with tenant payload (user_id, document_id, notebook_id)"
      - "Immediately purge transient S3 staging binaries post-upsert (0 MB idle storage)"
      - "Emit deterministic SSE progress events capped at 280s with Last-Event-ID replay"
      - "Trigger atomic credit refund via refund-credits.lua on terminal extraction failure"
      - "Support non-debiting retries using existing failed job IDs"
    interfaces:
      public_types:
        - "SourceType"
        - "PresignedUploadRequest"
        - "PresignedUploadResponse"
        - "SubmitIngestionRequest"
        - "IngestionJobAccepted"
        - "IngestionJobPayload"
        - "IngestionResult"
        - "TextChunk"
        - "IngestionChunkPayload"
        - "ProgressState"
        - "ProgressEvent"
        - "FailureReason"
        - "RefundResult"
        - "RetryResult"
      methods:
        - "createPresignedUploadUrl(userId: string, filename: string, fileSizeBytes: number): Promise<PresignedUploadResponse>"
        - "submitIngestionJob(payload: SubmitIngestionRequest): Promise<IngestionJobAccepted>"
        - "processIngestionJob(payload: IngestionJobPayload): Promise<IngestionResult>"
        - "subscribeProgressStream(jobId: string, lastEventId?: string): AsyncIterable<ProgressEvent>"
        - "refundCreditsOnFailure(jobId: string, userId: string, reason: FailureReason): Promise<RefundResult>"
        - "retryIngestionJob(jobId: string, userId: string, newStagingKey?: string): Promise<RetryResult>"
    dependencies:
      - target: "@aws-sdk/client-s3"
        severity: "ERROR"
        type: "external_service"
      - target: "@aws-sdk/s3-request-presigner"
        severity: "ERROR"
        type: "external_package"
      - target: "@upstash/vector"
        severity: "FATAL"
        type: "external_service"
      - target: "@upstash/qstash"
        severity: "ERROR"
        type: "external_service"
      - target: "@upstash/redis"
        severity: "FATAL"
        type: "external_service"
      - target: "@google/genai"
        severity: "ERROR"
        type: "external_service"
      - target: "@huggingface/transformers"
        severity: "WARN"
        type: "external_package"
      - target: "pdf-parse"
        severity: "ERROR"
        type: "external_package"
      - target: "youtube-transcript"
        severity: "ERROR"
        type: "external_package"
      - target: "@mozilla/readability"
        severity: "ERROR"
        type: "external_package"
      - target: "@repo/contracts"
        severity: "FATAL"
        type: "internal_package"
      - target: "@repo/config"
        severity: "FATAL"
        type: "internal_package"

  - id: "comp-reasoning"
