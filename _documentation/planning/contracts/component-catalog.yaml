    status: "ready-for-implementation"
    responsibilities:
      - "Decompose complex prompts into 2-5 sub-questions (FR-008, BR-007)"
      - "Generate HyDE hypothetical passages per sub-question (FR-009)"
      - "Execute top-3 vector searches in Upstash Vector per sub-question (FR-010, BR-008)"
      - "Deduplicate retrieved chunks and build grounded citation context (FR-011)"
      - "Stream grounded synthesis via Google Gemini Flash with inline citations (FR-011, BR-009)"
      - "Execute automatic circuit-breaker fallback to Groq Llama-3.3 on Gemini 429 (NFR-022, ADR-0004)"
      - "Append unavailable or processing sources disclosure in answer footer (FR-039)"
