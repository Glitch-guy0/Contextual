# Component Catalog — Architecture Contract
# Canonical software inventory, service boundaries, and dependency rules.
# Owned by architect-agent.
version: 1
updated_at: "2026-10-26T14:50:00.000Z"

components:
  - id: "comp-auth"
    name: "Authentication & Identity Module"
    package: "@repo/auth"
    owner: "architect-agent"
    responsibilities:
      - "Verify Clerk OAuth RS256 JWT tokens"
      - "Inject verified TenantContext into request context"
      - "Reject unauthenticated requests with HTTP 401 Problem Details"
    interfaces:
      public_types:
        - "TenantContext"
        - "AuthSession"
      methods:
        - "verifyToken(rawJwt: string): Promise<TenantContext>"
    dependencies:
      - target: "@clerk/backend"
        severity: "FATAL"
        type: "external_sdk"
      - target: "@repo/contracts"
        severity: "FATAL"
        type: "internal_package"

  - id: "comp-metering"
    name: "Metering Spine & Rate Limiter"
    package: "@repo/metering"
    owner: "architect-agent"
    responsibilities:
      - "Enforce 5 RPS sliding window rate limiting via Redis sorted sets"
      - "Execute atomic credit debit (0.5 LLM, 1.0 Ingest) via single Lua script"
      - "Short-circuit exhausted accounts with HTTP 402 Insufficient Credits"
      - "Execute idempotent daily 08:00 UTC credit resets"
      - "Classify upstream AI provider errors into RFC 9457 service limit details"
      - "Inject standardized RateLimit and X-Credit headers into HTTP responses"
    interfaces:
      public_types:
        - "RateLimitResult"
        - "DebitResult"
        - "ResetResult"
        - "QuotaClassification"
        - "RateLimitHeaders"
      methods:
        - "checkRateLimit(userId: string): Promise<RateLimitResult>"
        - "debitCredits(userId: string, cost: number, action: string): Promise<DebitResult>"
        - "resetDailyCredits(userId: string): Promise<ResetResult>"
        - "classifyQuotaError(upstreamError: unknown): QuotaClassification"
        - "generateRateLimitHeaders(limit: number, remaining: number, resetSeconds: number): Headers"
    dependencies:
      - target: "@upstash/redis"
        severity: "FATAL"
        type: "external_service"
      - target: "@repo/contracts"
        severity: "FATAL"
        type: "internal_package"

  - id: "comp-contracts"
    name: "Contracts & RFC 9457 Error System"
    package: "@repo/contracts"
    owner: "architect-agent"
    responsibilities:
      - "Enforce closed 17-member RFC 9457 Problem Details error catalogue"
      - "Format and sanitize HTTP API error envelopes"
      - "Export shared Zod DTOs, OpenAPI types, and quota extension interfaces"
    interfaces:
      public_types:
        - "ProblemDocument"
        - "ErrorCatalogueKey"
        - "QuotaExtension"
        - "ValidationErrorItem"
      methods:
        - "createProblemDetails(key: ErrorCatalogueKey, params: CreateProblemParams): ProblemDocument"
    dependencies:
      - target: "zod"
        severity: "FATAL"
        type: "external_package"

  - id: "comp-ingestion"
    name: "Transient Ingestion & Extraction Worker"
    package: "@repo/ingestion"
    owner: "architect-agent"
    status: implemented-scaffold
    responsibilities:
      - "Issue pre-signed Filebase S3 upload URLs (<= 5MB ceiling)"
      - "Parse PDF documents, YouTube transcripts, and web URLs"
      - "Recursively split text into 800-char semantic chunks with 100-char overlap"
      - "Generate dense vector embeddings via Google gemini-embedding-001 (768-dim)"
      - "Execute in-process fallback embeddings via @huggingface/transformers ONNX on Google 429"
      - "Upsert vectors to Upstash Vector with tenant payload (user_id, document_id, notebook_id)"
      - "Immediately purge transient S3 staging binaries post-upsert (0 MB idle storage)"
      - "Emit deterministic SSE progress events capped at 280s with Last-Event-ID replay"
      - "Trigger atomic credit refund via refund-credits.lua on terminal extraction failure"
      - "Support non-debiting retries using existing failed job IDs"
    interfaces:
      public_types:
        - "SourceType"
        - "PresignedUploadRequest"
        - "PresignedUploadResponse"
        - "SubmitIngestionRequest"
        - "IngestionJobAccepted"
        - "IngestionJobPayload"
        - "IngestionResult"
        - "TextChunk"
        - "IngestionChunkPayload"
        - "ProgressState"
        - "ProgressEvent"
        - "FailureReason"
        - "RefundResult"
        - "RetryResult"
      methods:
        - "createPresignedUploadUrl(userId: string, filename: string, fileSizeBytes: number): Promise<PresignedUploadResponse>"
        - "submitIngestionJob(payload: SubmitIngestionRequest): Promise<IngestionJobAccepted>"
        - "processIngestionJob(payload: IngestionJobPayload): Promise<IngestionResult>"
        - "subscribeProgressStream(jobId: string, lastEventId?: string): AsyncIterable<ProgressEvent>"
        - "refundCreditsOnFailure(jobId: string, userId: string, reason: FailureReason): Promise<RefundResult>"
        - "retryIngestionJob(jobId: string, userId: string, newStagingKey?: string): Promise<RetryResult>"
    dependencies:
      - target: "@aws-sdk/client-s3"
        severity: "ERROR"
        type: "external_service"
      - target: "@aws-sdk/s3-request-presigner"
        severity: "ERROR"
        type: "external_package"
      - target: "@upstash/vector"
        severity: "FATAL"
        type: "external_service"
      - target: "@upstash/qstash"
        severity: "ERROR"
        type: "external_service"
      - target: "@upstash/redis"
        severity: "FATAL"
        type: "external_service"
      - target: "@google/genai"
        severity: "ERROR"
        type: "external_service"
      - target: "@huggingface/transformers"
        severity: "WARN"
        type: "external_package"
      - target: "pdf-parse"
        severity: "ERROR"
        type: "external_package"
      - target: "youtube-transcript"
        severity: "ERROR"
        type: "external_package"
      - target: "@mozilla/readability"
        severity: "ERROR"
        type: "external_package"
      - target: "@repo/contracts"
        severity: "FATAL"
        type: "internal_package"
      - target: "@repo/config"
        severity: "FATAL"
        type: "internal_package"

  - id: "comp-reasoning"
    name: "6-Phase Grounded Reasoning Engine"
    package: "@repo/reasoning"
    owner: "architect-agent"
    milestone: "M5"
    status: "ready-for-implementation"
    responsibilities:
      - "Decompose complex prompts into 2-5 sub-questions (FR-008, BR-007)"
      - "Generate HyDE hypothetical passages per sub-question (FR-009)"
      - "Execute top-3 vector searches in Upstash Vector per sub-question (FR-010, BR-008)"
      - "Deduplicate retrieved chunks and build grounded citation context (FR-011)"
      - "Stream grounded synthesis via Google Gemini Flash with inline citations (FR-011, BR-009)"
      - "Execute automatic circuit-breaker fallback to Groq Llama-3.3 on Gemini 429 (NFR-022, ADR-0004)"
      - "Append unavailable or processing sources disclosure in answer footer (FR-039)"
    interfaces:
      public_types:
        - "SubQuestion"
        - "HydePassage"
        - "RetrievedContextChunk"
        - "CitationAnchor"
        - "StreamReasoningChunk"
        - "ChatSynthesisRequest"
        - "ChatSynthesisResult"
        - "InferenceProviderType"
      methods:
        - "synthesizeStream(ctx: TenantContext, req: ChatSynthesisRequest): AsyncIterable<StreamReasoningChunk>"
        - "decomposeQuery(prompt: string): Promise<SubQuestion[]>"
        - "generateHyde(subQuestions: SubQuestion[]): Promise<HydePassage[]>"
        - "retrieveContext(ctx: TenantContext, notebookId: string, subQuestions: SubQuestion[]): Promise<RetrievedContextChunk[]>"
    dependencies:
      - target: "@google/genai"
        severity: "FATAL"
        type: "external_service"
      - target: "groq-sdk"
        severity: "WARN"
        type: "external_service"
      - target: "@upstash/vector"
        severity: "FATAL"
        type: "external_service"
      - target: "@repo/contracts"
        severity: "FATAL"
        type: "internal_package"
      - target: "@repo/config"
        severity: "FATAL"
        type: "internal_package"
      - target: "@repo/metering"
        severity: "FATAL"
        type: "internal_package"

  - id: "comp-memory"
    name: "Pluggable Long-Term Memory Store"
    package: "@repo/memory"
    owner: "architect-agent"
    responsibilities:
      - "Provide abstract MemoryStore interface for cross-session user context"
      - "In-process Mem0 engine backed by Upstash Redis and Upstash Vector"
      - "Extraction seam support for standalone worker deployment mode"
      - "Enforce strict multi-tenant isolation and user memory cascade purge"
    interfaces:
      methods:
        - "add(userId: string, content: string, metadata?: Record<string, unknown>): Promise<MemoryAddResult>"
        - "search(userId: string, query: string, options?: MemorySearchOptions): Promise<MemoryItem[]>"
        - "get(userId: string, memoryId: string): Promise<MemoryItem | null>"
        - "delete(userId: string, memoryId: string): Promise<boolean>"
        - "deleteUserMemories(userId: string): Promise<MemoryDeleteResult>"
        - "list(userId: string, limit?: number): Promise<MemoryItem[]>"
    dependencies:
      - target: "@repo/contracts"
        severity: "FATAL"
        type: "internal_package"
      - target: "@repo/config"
        severity: "FATAL"
        type: "internal_package"
      - target: "@upstash/vector"
        severity: "WARN"
        type: "external_service"
      - target: "@upstash/redis"
        severity: "WARN"
        type: "external_service"

  - id: "comp-db"
    name: "Relational Persistence & Schemas"
    package: "@repo/db"
    owner: "architect-agent"
    responsibilities:
      - "Type-safe SQL queries and migrations via Kysely"
      - "Persist users, notebooks, text nodes, document nodes, typed edges, and tombstones"
      - "Scale-to-zero serverless database connection management"
    interfaces:
      methods:
        - "getKyselyDb(): Kysely<Database>"
        - "runMigrations(): Promise<void>"
    dependencies:
      - target: "pg"
        severity: "FATAL"
        type: "external_service"
      - target: "kysely"
        severity: "FATAL"
        type: "internal_package"

  - id: "comp-workspace"
    name: "Notebook Workspace & Domain Graph"
    package: "@repo/workspace"
    owner: "architect-agent"
    milestone: "M4"
    responsibilities:
      - "CRUD for hierarchical text nodes and document-backed reference nodes (FR-031)"
      - "Validate typed edges against the closed union cites|related before any query (FR-032)"
      - "Resolve document cards with source metadata under a 10ms p95 budget (FR-033)"
      - "Gate scoped retrieval on an ownership predicate BEFORE the metering debit (FR-034, BR-036)"
      - "Answer foreign or unowned scopes with HTTP 404 and zero credit debit (M4-PM-001)"
    interfaces:
      public_types:
        - "EdgeType"
        - "NodeDTO"
        - "DocumentCard"
        - "ScopedSearchRequest"
        - "WorkspaceRepository"
      methods:
        - "createNode(ctx: TenantContext, input: CreateNodeInput): Promise<NodeDTO>"
        - "createEdge(ctx: TenantContext, input: CreateEdgeInput): Promise<EdgeDTO>"
        - "resolveCard(ctx: TenantContext, nodeId: string): Promise<DocumentCard>"
        - "scopedSearch(ctx: TenantContext, req: ScopedSearchRequest): Promise<ScopedSearchResult>"
    dependencies:
      - target: "@repo/db"
        severity: "FATAL"
        type: "internal_package"
      - target: "@repo/contracts"
        severity: "FATAL"
        type: "internal_package"
      - target: "@repo/metering"
        severity: "ERROR"
        type: "internal_package"

  - id: "comp-config"
    name: "Environment Configuration & Diagnostic Doctor"
    package: "@repo/config"
    owner: "architect-agent"
    responsibilities:
      - "Strict runtime Zod validation of all environment variables"
      - "TypeScript tsconfig base and framework configurations"
      - "8-layer diagnostic health probe (dev:doctor) for local developer onboarding"
    interfaces:
      public_types:
        - "AppConfig"
        - "DoctorResult"
      methods:
        - "validateEnv(): AppConfig"
        - "runDoctor(): Promise<DoctorResult[]>"
    dependencies:
      - target: "zod"
        severity: "FATAL"
        type: "external_package"

  - id: "comp-middleware"
    name: "Edge Security & Multi-Tenant Middleware"
    package: "apps/platform"
    owner: "architect-agent"
    responsibilities:
      - "Intercept all requests to /api/v1/* and enforce Clerk Bearer token authentication"
      - "Extract and verify RS256 JWT signatures offline using Clerk JWKS"
      - "Inject verified TenantContext headers into request pipeline"
      - "Reject unauthenticated or invalid calls with HTTP 401 RFC 9457 Problem Details"
    interfaces:
      methods:
        - "middleware(req: NextRequest): Promise<NextResponse>"
    dependencies:
      - target: "@repo/auth"
        severity: "FATAL"
        type: "internal_package"
      - target: "@repo/contracts"
        severity: "FATAL"
        type: "internal_package"

rules:
  - "Domain packages must never import Next.js web transport libraries (next/server)"
  - "Graph reads and writes must carry a user_id tenant predicate inside the repository; route handlers never issue their own SQL"
  - "@repo/metering debit may only be invoked after the workspace ownership predicate has returned a row"
  - "Direct database connections must never be instantiated outside @repo/db"
  - "All external vector calls must route through @repo/contracts/VectorStore interface"
  - "All upstream error handling must map directly to RFC 9457 Problem Details"
  - "100% of protected API endpoints (/api/v1/*) must sit behind comp-middleware guard"

