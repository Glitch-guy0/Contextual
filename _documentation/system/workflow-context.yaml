      summary: "Superseded by ADR-0004"
    - id: "ADR-0002"
      summary: "Runtime split (Bun tooling, Node 22 runtime), Kysely ORM, Better Stack direct OTLP telemetry"
    - id: "ADR-0003"
      summary: "Filebase S3 for transient staging only (5 MB cap), post-ingestion deletion, Qdrant as sole record"
    - id: "ADR-0004"
      summary: "Adopt Unified Upstash Serverless Ecosystem (Redis, Vector, QStash) & Groq Fallback; supersede Cloudflare and Qdrant"
