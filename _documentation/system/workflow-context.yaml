    - id: "M2-ARCH-001"
      summary: "Atomic Upstash Redis Lua credit ledger (10.0 grant, 0.5 LLM, 1.0 ingest), 5 RPS sliding rate limiter, HTTP 402 short-circuit guard, closed 17-member RFC 9457 error catalogue, idempotent daily 08:00 UTC resets"
    - id: "M3-ARCH-001"
      summary: "Transient Ingestion Pipeline & Multi-Source Extraction: direct-to-S3 Filebase staging (<= 5MB), QStash webhook tasks, PDF/YouTube/Web extractors, 800-char semantic chunking, Google gemini-embedding-001 (768-dim) with local ONNX fallback, Upstash Vector indexing with tenant metadata, 280s SSE progress stream, atomic refund-credits.lua compensation, and non-debiting retries."
    - id: "M4-PM-001"
      summary: "Foreign or unowned notebook scope answers HTTP 404 notebook-not-found with 0 credits debited; 403 reserved for tenant violations carrying no resource id. Supersedes epic-004 AC-3."
    - id: "M4-PM-002"
