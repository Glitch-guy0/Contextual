    - id: "M4-ARCH-001"
      summary: "Adjacency-list graph tables (notebook_nodes, notebook_edges) in Neon/Kysely with composite (user_id, notebook_id) indexes; expand-only migration 002; ownership as a reading-statement predicate; edge type enforced by API union AND DB CHECK."
    - id: "M4-SPR-001"
      summary: "Sprint board M4-S1 with six frozen stories S4.1..S4.6, DAG S4.1 -> S4.2 -> {S4.3,S4.4,S4.5} -> S4.6; S4.5 carries HIGH tier at the metering boundary."
