# infra/compose.local.yaml — Full Local Developer & Application Stack
# Contextual AI Platform (v1.0.0)
services:
  postgres:
    image: postgres:16-alpine
    container_name: contextual-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: contextual_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contextual_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: contextual-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile.local
    container_name: contextual-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: "development"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/contextual_dev"
      REDIS_URL: "redis://redis:6379"
      LOG_LEVEL: "info"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_YWRqdXN0ZWQtY29sdC00NDExLmNsZXJrLmFjY291bnRzLmRldiQ"
      CLERK_SECRET_KEY: sk_test_K1CGZvefMfehMCLKA2zOHob95MXdqse51tZiID0kYl
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:3000/api/v1/health\").then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))'"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
